<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habeshan X Post</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Habeshan X Post</h1>
    <p>Latest Posts</p>

    <a href="https://t.me/Habeshanxpostbot" target="_blank">
      <button>Continue to Telegram</button>
    </a>
  </header>

  <main class="container">

    <article class="post">
      <h2>Welcome to Habeshan X Post</h2>
      <p>Welcome to our website. Check out the latest posts below.</p>

      <button class="like-btn" data-likes="0">
        ❤️ Like 0
      </button>

      <button class="comment-btn">
        💬 Comment
      </button>

      <div class="comment-box" style="display: none;">
        <input type="text" placeholder="Write a comment...">
        <button class="send-comment">Send</button>
      </div>
    </article>

    <article class="post">
      <h2>Latest Post</h2>
      <p>Check out our latest content and updates.</p>

      <button class="like-btn" data-likes="0">
        ❤️ Like 0
      </button>

      <button class="comment-btn">
        💬 Comment
      </button>

      <div class="comment-box" style="display: none;">
        <input type="text" placeholder="Write a comment...">
        <button class="send-comment">Send</button>
      </div>
    </article>

  </main>

  <footer>
    <p>© 2026 Habeshan X Post</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
